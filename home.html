<script>
(function () {
  'use strict';

  var ARROW_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M5 12h13M12 6l6 6-6 6"></path></svg>';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderCard(a) {
    if (a.dataset.geoReady) return;
    a.dataset.geoReady = '1';

    var href = a.getAttribute('href') || '';
    var title = a.dataset.title || href;
    var desc = a.dataset.desc || '';

    var host = href;
    try { host = new URL(href).host; } catch (e) {}

    var icon = a.dataset.icon;
    if (!icon) {
      try { icon = new URL(href).origin + '/favicon.ico'; } catch (e) { icon = ''; }
    }

    a.classList.add('geo-card__link');
    if (!a.hasAttribute('target')) a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener noreferrer');

    a.innerHTML =
      '<span class="geo-card__icon">' +
        (icon
          ? '<img class="geo-card__favicon" src="' + esc(icon) + '" alt="" ' +
            'loading="lazy" decoding="async" onerror="this.remove()">'
          : '') +
      '</span>' +
      '<span class="geo-card__body">' +
        '<span class="geo-card__title">' + esc(title) + '</span>' +
        (desc ? '<span class="geo-card__desc">' + esc(desc) + '</span>' : '') +
        '<span class="geo-card__host">' + esc(host) + '</span>' +
      '</span>' +
      '<span class="geo-card__arrow" aria-hidden="true">' + ARROW_SVG + '</span>';
  }

  function initGeoCards() {
    var root = document.querySelector('#geo-cards');
    if (!root || root.dataset.geoReady) return;
    root.dataset.geoReady = '1';

    Array.prototype.forEach.call(root.children, function (el) {
      if (el.tagName === 'A') renderCard(el);
    });
  }

  function mount() { initGeoCards(); }

  mount();

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  }

  var tries = 0;
  var timer = setInterval(function () {
    mount();
    if (document.querySelector('#geo-cards[data-geo-ready]') || ++tries > 30) {
      clearInterval(timer);
    }
  }, 100);
})();
</script>
