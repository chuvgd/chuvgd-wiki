<script>
(function () {
  'use strict';

  var ARROW_SVG =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M5 12h13M12 6l6 6-6 6"></path></svg>';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(a) {
    if (a.dataset.geoReady) return;
    a.dataset.geoReady = '1';

    var href  = a.getAttribute('href') || '';
    var title = a.textContent.trim();
    var desc  = a.getAttribute('desc') || '';
    var icon  = a.getAttribute('icon') || '';
    var host  = '';

    try {
      var u = new URL(href, document.baseURI);
      host = u.host;
      if (!icon && (u.protocol === 'http:' || u.protocol === 'https:')) {
        icon = u.origin + '/favicon.ico';
      }
    } catch (e) { /* 非法 URL：host 留空，不显示图标 */ }

    a.classList.add('geo-card__link');

    a.innerHTML =
      '<span class="geo-card__icon">' +
        (icon
          ? '<img class="geo-card__favicon" src="' + esc(icon) + '" alt="" ' +
            'loading="lazy" decoding="async" onerror="this.remove()">'
          : '') +
      '</span>' +
      '<span class="geo-card__body">' +
        '<span class="geo-card__title">' + esc(title) + '</span>' +
        (desc ? '<span class="geo-card__desc">' + esc(desc) + '</span>' : '') +
        '<span class="geo-card__host">' + esc(host) + '</span>' +
      '</span>' +
      '<span class="geo-card__arrow" aria-hidden="true">' + ARROW_SVG + '</span>';
  }

  function init() {
    var cards = document.querySelectorAll('.geo-cards > a');
    for (var i = 0; i < cards.length; i++) render(cards[i]);
  }

  // 防抖，避免 Vue 频繁更新 DOM 时反复触发
  var timer = null;
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(init, 50);
  }

  function start() {
    init();

    // 监听 Vue 的 DOM 变化（SPA 核心适配）
    if (window.MutationObserver) {
      new MutationObserver(schedule).observe(document.body, {
        childList: true,
        subtree: true
      });
    } else {
      setInterval(init, 1000); // 极老浏览器兜底
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
