<h2>面试内容</h2>
<p>包括交流信息、提问两个内容：</p>
<ol>
  <li>交流：告诉他们我们是什么情况，比赛的内容。把必要的讲完他们也可以提问相关的内容</li>
  <li>提问：看个人素养，看有没有特殊能力，做评价</li>
</ol>
<h3>通用内容</h3>
<p>沟通</p>
<figure class="table">
  <table>
    <tbody>
      <tr>
        <td><strong>队伍的好处</strong></td>
        <td><strong>队伍的风险</strong></td>
      </tr>
      <tr>
        <td>对找工作，比赛经历的含金量</td>
        <td>跨校区工作<br>（包括培训难度，可能有的校区培训线下机会少一点）</td>
      </tr>
      <tr>
        <td>奖项，加分（国三）</td>
        <td>工时（10、20）</td>
      </tr>
      <tr>
        <td>人脉</td>
        <td>寒暑假留校</td>
      </tr>
      <tr>
        <td>&nbsp;学习知识技术，实践机会</td>
        <td>付出大量时间，<strong>保研</strong>性价比低</td>
      </tr>
      <tr>
        <td>&nbsp;</td>
        <td>比赛路费、住宿费自费</td>
      </tr>
    </tbody>
  </table>
</figure>
<p>提问</p>
<figure class="table">
  <table>
    <tbody>
      <tr>
        <td><strong>硬实力</strong></td>
        <td><strong>软实力</strong></td>
        <td><strong>潜力</strong></td>
        <td><strong>文化契合</strong></td>
      </tr>
      <tr>
        <td>是否做过小项目</td>
        <td>抗压能力（如果进度拖延）</td>
        <td>逻辑严谨，注重细节</td>
        <td>如果队伍任务和个人计划冲突</td>
      </tr>
      <tr>
        <td>根据小项目询问技术细节<br>（真做过还是直接抄的）</td>
        <td>团队协作意识<br>（交流能力、合作意愿、适应团队）</td>
        <td>对技术体系有自己的认识和想法</td>
        <td>如果有时间愿不愿意来队里干活</td>
      </tr>
      <tr>
        <td>&nbsp;</td>
        <td>自主学习能力，信息检索能力<br>（能不能学习到知识）</td>
        <td>&nbsp;有学习技术知识的热情</td>
        <td><strong>来这个队伍是为了什么</strong>，是否要保研</td>
      </tr>
      <tr>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td>&nbsp;是否热爱技术，愿意钻研，而不是纯抄开源和AI</td>
      </tr>
    </tbody>
  </table>
</figure>
