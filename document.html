<h1 id="这里是技术文档" class="toc-header"> 这里是技术文档！！！</h1>
<p>在 <code>/document/</code> 文件夹下，可以放置所有技术文档，包括但不限于：</p>
<ol>
<li>队内/对外开源</li>
<li>经验分享</li>
<li>学习指北/指南</li>
</ol>
<p>希望大家积极添加技术文章！</p>
<h2 id="创建新文章" class="toc-header"> 创建新文章</h2>
<p>你可以在 <code>/document/</code> 文件夹下创建命名为 <code>文章标题-你的名字</code> 的页面（约定）。</p>
<p>下面是一个简单的创建工具：</p>

<div class="dt-form"></div>

<p>只能使用<strong>字母、数字、汉字</strong>与 <code>-</code> <code>_</code>；<strong>区分大小写</strong>；建议使用英文和数字。若跳转后进入编辑页，说明该名字已被占用。</p>

<h2>文档列表</h2>

<p>如果你想要搜索，请使用页面顶端的搜索框</p>

<div id="dt-list" class="dt-list">加载中…</div>

<script>
(function () {
  'use strict';

  var m = location.pathname.match(/^\/(?:e\/)?([a-zA-Z-]+)\//);
  var LOCALE = m ? m[1] : 'zh';
  var DIR = 'document';
  var VIEW = '/' + LOCALE + '/';
  var EDIT = '/e/' + LOCALE + '/';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtDate(v) {
    var d = new Date(v);
    if (isNaN(d)) return '';
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function toSlug(name) {
    var r = String(name);
    if (/[\u4e00-\u9fff]/.test(r) && window.pinyinPro) {
      try { r = pinyinPro.pinyin(r, { toneType: 'none', mode: 'surname' }); } catch (e) {}
    }
    return r.replace(/\s+/g, '').replace(/[^A-Za-z0-9_-]/g, '');
  }

  function getCurrentPath() {
    var p = location.pathname.replace(/^\/e\//, '/').replace(/^\/[a-zA-Z-]+\//, '');
    try { p = decodeURIComponent(p); } catch (e) {}
    return p.replace(/\/+$/, '');
  }

  /* ---------------- 表单 ---------------- */
  function initForm() {
    var form = document.querySelector('.dt-form');
    if (!form || form.dataset.ready) return;
    form.dataset.ready = '1';

    form.innerHTML =
      '<label>文章名</label>' +
      '<input id="dt-title" type="text" placeholder="例如：Docker 部署笔记" autocomplete="off">' +
      '<p class="dt-hint" id="dt-title-hint"></p>' +
      '<label>署名</label>' +
      '<input id="dt-name" type="text" placeholder="你的名字或昵称" autocomplete="off">' +
      '<p class="dt-hint" id="dt-name-hint"></p>' +
      '<p class="dt-preview" id="dt-preview"></p>' +
      '<div class="dt-actions">' +
        '<button type="button" data-role="confirm">创建</button>' +
        '<button type="button" data-role="reset">清空</button>' +
      '</div>';

    var titleEl = form.querySelector('#dt-title');
    var nameEl = form.querySelector('#dt-name');
    var titleHint = form.querySelector('#dt-title-hint');
    var nameHint = form.querySelector('#dt-name-hint');
    var preview = form.querySelector('#dt-preview');
    var slug = '';

    function check(input, hint) {
      var v = input.value.trim();
      var msg = '', cls = 'dt-hint';
      if (v) {
        if (!/^[A-Za-z0-9_\u4e00-\u9fff-]+$/.test(v)) {
          msg = '只能包含字母、数字、汉字、- 和 _'; cls += ' is-error';
        } else if (/[\u4e00-\u9fff]/.test(v)) {
          msg = '建议改用英文或数字（仍可继续）'; cls += ' is-warn';
        }
      }
      hint.textContent = msg;
      hint.className = cls;
      input.classList.toggle('is-error', cls.indexOf('is-error') > -1);
      return cls.indexOf('is-error') === -1;
    }

    function updatePreview() {
      var t = titleEl.value.trim(), n = nameEl.value.trim();
      slug = (t && n) ? t + '-' + n : '';
      if (!slug) { preview.style.display = 'none'; return; }
      preview.style.display = '';
      preview.innerHTML = '将创建：<code>/' + esc(DIR + '/' + slug) + '</code>';
    }

    function submit() {
      var okT = check(titleEl, titleHint);
      var okN = check(nameEl, nameHint);
      if (!titleEl.value.trim()) {
        titleHint.textContent = '请填写文章名'; titleHint.className = 'dt-hint is-error';
        titleEl.classList.add('is-error'); okT = false;
      }
      if (!nameEl.value.trim()) {
        nameHint.textContent = '请填写你的署名'; nameHint.className = 'dt-hint is-error';
        nameEl.classList.add('is-error'); okN = false;
      }
      if (!okT || !okN) return;
      var full = DIR + '/' + slug;
      location.href = EDIT + full.split('/').map(encodeURIComponent).join('/');
    }

    [titleEl, nameEl].forEach(function (el) {
      el.addEventListener('input', function () {
        check(el, el === titleEl ? titleHint : nameHint);
        updatePreview();
      });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
      });
    });

    form.querySelector('[data-role="confirm"]').addEventListener('click', submit);
    form.querySelector('[data-role="reset"]').addEventListener('click', function () {
      titleEl.value = nameEl.value = '';
      titleHint.textContent = nameHint.textContent = '';
      titleHint.className = nameHint.className = 'dt-hint';
      titleEl.classList.remove('is-error');
      nameEl.classList.remove('is-error');
      updatePreview();
      titleEl.focus();
    });

    /* ============ 核心修复：轮询等待 WIKI.$store 可用 ============ */
    nameHint.textContent = '正在获取当前用户…';

    var userTries = 0;
    var userTimer = setInterval(function () {
      var name = null;
      try {
        if (window.WIKI && WIKI.$store && typeof WIKI.$store.get === 'function') {
          name = WIKI.$store.get('user/name');
        }
      } catch (e) {}

      if (name) {
        clearInterval(userTimer);
        // 同时加载拼音库（如果还没加载）
        if (!window.pinyinPro) {
          var s = document.createElement('script');
          s.src = 'https://unpkg.com/pinyin-pro@3/dist/index.js';
          s.onload = function () { fillName(name); };
          s.onerror = function () {
            nameHint.textContent = '拼音库加载失败，请手动填写';
            nameHint.className = 'dt-hint is-warn';
          };
          document.head.appendChild(s);
        } else {
          fillName(name);
        }
        return;
      }

      // 超过 10 秒仍未就绪，放弃
      if (++userTries > 100) {
        clearInterval(userTimer);
        nameHint.textContent = '未登录，请手动填写';
        nameHint.className = 'dt-hint is-warn';
      }
    }, 100);

    function fillName(rawName) {
      var slugName = toSlug(rawName);
      if (!slugName) { nameHint.textContent = '请手动填写'; return; }
      nameEl.value = slugName;
      nameHint.textContent = '已自动填入：' + slugName;
      nameHint.className = 'dt-hint';
      updatePreview();
    }
  }

  /* ---------------- 列表 ---------------- */
  function initList() {
    var listEl = document.querySelector('#dt-list');
    if (!listEl || listEl.dataset.ready) return;
    listEl.dataset.ready = '1';

    var currentPath = getCurrentPath();

    fetch('/graphql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ query: '{ pages { list { title path updatedAt tags } } }' })
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var list = (res.data && res.data.pages && res.data.pages.list) || [];
      list = list.filter(function (p) {
        return p.path !== currentPath && (p.path === DIR || p.path.indexOf(DIR + '/') === 0);
      }).sort(function (a, b) { return a.path.localeCompare(b.path); });

      if (!list.length) {
        listEl.innerHTML = '<div class="dt-empty">暂无文章</div>';
        return;
      }

      listEl.innerHTML = list.map(function (p) {
        var url = VIEW + p.path.split('/').map(encodeURIComponent).join('/');
        var date = fmtDate(p.updatedAt);
        var tags = (p.tags || []).map(function (t) {
          return '<span class="dt-tag">' + esc(t) + '</span>';
        }).join('');
        return '<a class="dt-item" href="' + esc(url) + '">' +
                 '<div class="dt-item-head">' +
                   '<span class="dt-item-title">' + esc(p.title || p.path) + '</span>' +
                   (tags ? '<span class="dt-item-tags">' + tags + '</span>' : '') +
                   (date ? '<span class="dt-item-date">' + esc(date) + '</span>' : '') +
                 '</div>' +
               '</a>';
      }).join('');
    })
    .catch(function (err) {
      listEl.innerHTML = '<div class="dt-empty">加载失败：' + esc(err.message) + '</div>';
    });
  }

  /* ---------------- 挂载 ---------------- */
  function mount() {
    initForm();
    initList();
  }

  mount();

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mount);
  }

  var tries = 0;
  var timer = setInterval(function () {
    mount();
    var formOk = document.querySelector('.dt-form[data-ready]');
    var listOk = document.querySelector('#dt-list[data-ready]');
    if ((formOk && listOk) || ++tries > 30) clearInterval(timer);
  }, 100);

})();
</script>
