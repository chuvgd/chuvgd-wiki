<h1 id="这里是技术文档" class="toc-header"> 这里是技术文档！！！</h1>
<p>在 <code>/document/</code> 文件夹下，可以放置所有你们的技术文章，包括但不限于：</p>
<ol>
<li>队内/对外开源</li>
<li>经验分享</li>
<li>学习指北/指南</li>
</ol>
<p>希望大家积极发表文章，积累经验，为 VGD 传承和协作付出贡献！</p>
<h2 id="创建新文章" class="toc-header"> 创建新文章</h2>
<p>你可以在 <code>/document/</code> 文件夹下创建命名为 <code>文章标题-你的名字</code> 的页面（约定）。</p>
<p>下面是一个简单的创建工具：</p>

<!---------------------------------------------------------- tool start ------------------------------------------------------------------->

<div id="doc-toolkit" class="dt-root">

  <!-- ================= 工具一：创建文章 ================= -->
  <section class="dt-card">
    <header class="dt-card-head">
      <span class="dt-card-icon">✏️</span>
      <h3 class="dt-card-title">创建新文章</h3>
    </header>

    <div class="dt-body">
      <div class="dt-field">
        <label class="dt-label" for="dt-title">文章名</label>
        <input class="dt-input" type="text" id="dt-title"
               placeholder="例如：Docker 部署笔记" autocomplete="off" spellcheck="false">
        <p class="dt-hint" id="dt-title-hint"></p>
      </div>

      <div class="dt-field">
        <label class="dt-label" for="dt-name">署名</label>
        <input class="dt-input" type="text" id="dt-name"
               placeholder="你的名字或昵称" autocomplete="off" spellcheck="false">
        <p class="dt-hint" id="dt-name-hint"></p>
      </div>

      <p class="dt-preview" id="dt-preview"></p>

      <p class="dt-note">
        只能使用<strong>字母、数字、汉字</strong>与 <code>-</code> <code>_</code>；
        <strong>区分大小写</strong>；建议使用英文和数字。若跳转后进入编辑页，说明该名字已被占用。
      </p>

      <div class="dt-actions">
        <button class="dt-btn dt-btn--primary" type="button" id="dt-confirm">创建</button>
        <button class="dt-btn dt-btn--ghost" type="button" id="dt-reset">清空</button>
      </div>
    </div>
  </section>

  <!-- ================= 工具二：文档列表 ================= -->
  <section class="dt-card">
    <header class="dt-card-head">
      <span class="dt-card-icon">📚</span>
      <h3 class="dt-card-title">文档列表</h3>
      <span class="dt-count" id="dt-count"></span>
    </header>

    <div class="dt-body">
      <p class="dt-tip">如果你想要搜索，请使用页面顶端的搜索框</p>

      <div class="dt-list" id="dt-list">
        <div class="dt-empty">加载中…</div>
      </div>
    </div>
  </section>

</div>
